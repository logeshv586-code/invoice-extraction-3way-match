[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-extraction-3way-match"
version = "0.1.0"
description = "Purchase invoice extraction, GST validation and deterministic 3-way matching"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
  "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
